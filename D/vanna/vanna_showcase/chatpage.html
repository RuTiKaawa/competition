<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#071310">
  <title>Vanna AI · Chinook 数据助手</title>
  <script type="module" src="https://img.vanna.ai/vanna-components.js"></script>
  <style>
    :root {
      --ink: #f1f7f5;
      --muted: #9fb4ae;
      --dim: #6f8580;
      --canvas: #06110e;
      --panel: rgba(13, 31, 26, .82);
      --line: rgba(152, 191, 179, .18);
      --teal: #45e0bc;
      --shadow: 0 28px 80px rgba(0, 0, 0, .34);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 0;
      color-scheme: dark;
    }

    body {
      min-width: 0;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 4%, rgba(37, 178, 143, .16), transparent 28rem),
        radial-gradient(circle at 92% 24%, rgba(56, 117, 101, .12), transparent 30rem),
        var(--canvas);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      opacity: .2;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }

    a { color: inherit; }

    .shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .nav {
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
      padding: 24px 0;
    }

    .brand {
      display: inline-flex;
      gap: 11px;
      align-items: center;
      min-width: 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 750;
      letter-spacing: .08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid rgba(69, 224, 188, .45);
      border-radius: 11px;
      color: var(--teal);
      background: rgba(69, 224, 188, .08);
      box-shadow: inset 0 0 20px rgba(69, 224, 188, .06);
    }

    .nav-link {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
      transition: color .2s ease, transform .2s ease;
    }

    .nav-link:hover {
      color: var(--teal);
      transform: translateX(-2px);
    }

    .chat-page {
      min-width: 0;
      padding: 24px 0 56px;
    }

    .page-intro {
      display: flex;
      gap: 32px;
      align-items: end;
      justify-content: space-between;
      min-width: 0;
      margin: 0 auto 26px;
      max-width: 1024px;
    }

    .intro-copy { min-width: 0; }

    .eyebrow {
      display: inline-flex;
      gap: 9px;
      align-items: center;
      margin-bottom: 12px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 7px;
      height: 7px;
      content: "";
      border-radius: 999px;
      background: var(--teal);
      box-shadow: 0 0 18px var(--teal);
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -.045em;
      text-wrap: balance;
    }

    .lede {
      max-width: 670px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .source-badge {
      display: inline-flex;
      gap: 9px;
      align-items: center;
      flex: 0 0 auto;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, .025);
      font-size: 12px;
      white-space: nowrap;
    }

    .source-badge::before {
      width: 6px;
      height: 6px;
      content: "";
      border-radius: 999px;
      background: var(--teal);
      box-shadow: 0 0 12px rgba(69, 224, 188, .7);
    }

    .chat-frame {
      min-width: 0;
      max-width: 1060px;
      margin: 0 auto;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background:
        linear-gradient(145deg, rgba(29, 67, 56, .46), rgba(8, 22, 18, .64)),
        var(--panel);
      box-shadow: var(--shadow);
    }

    vanna-chat {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .page-note {
      max-width: 1024px;
      margin: 18px auto 0;
      color: var(--dim);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 760px) {
      .shell { width: min(100% - 28px, 1180px); }

      .nav { padding-top: 18px; }

      .nav-link { font-size: 12px; }

      .chat-page { padding-top: 14px; }

      .page-intro {
        display: grid;
        gap: 16px;
        margin-bottom: 20px;
      }

      .source-badge { justify-self: start; }

      .chat-frame {
        padding: 9px;
        border-radius: 20px;
      }
    }

    @media (max-width: 380px) {
      .shell { width: calc(100% - 24px); }

      .nav { gap: 14px; }

      .brand {
        gap: 8px;
        font-size: 13px;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
      }

      h1 { font-size: 34px; }

      .chat-frame { padding: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .nav-link { transition: none; }
    }
  </style>
</head>
<body>
  <header class="shell nav">
    <a class="brand" href="/" aria-label="Vanna AI 首页">
      <span class="brand-mark" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none">
          <path d="M3 4.5 9.9 16 17 4.5h-3.4L9.9 11 6.2 4.5H3Z" fill="currentColor"/>
        </svg>
      </span>
      Vanna AI
    </a>
    <a class="nav-link" href="/">
      <span aria-hidden="true">←</span>
      返回能力首页
    </a>
  </header>

  <main class="shell chat-page">
    <section class="page-intro" aria-labelledby="page-title">
      <div class="intro-copy">
        <div class="eyebrow">Live data workspace</div>
        <h1 id="page-title">Chinook 数据助手</h1>
        <p class="lede">
          用自然语言查询音乐商店数据并查看可验证的 SQL 结果。试试“列出数据库所有表”，
          或“按国家统计销售额并绘制柱状图”。
        </p>
      </div>
      <div class="source-badge">Chinook SQLite · 只读</div>
    </section>

    <section class="chat-frame" aria-label="Chinook 数据查询对话">
      <vanna-chat
        theme="dark"
        title="Chinook 数据助手"
        placeholder="试试：列出数据库所有表，或按国家统计销售额并绘制柱状图"
        api-base="/chat"
        sse-endpoint="/api/vanna/v2/chat_sse"
        ws-endpoint="/api/vanna/v2/chat_websocket"
        poll-endpoint="/api/vanna/v2/chat_poll">
      </vanna-chat>
    </section>

    <p class="page-note">查询通过本地只读数据工具执行；模型凭据仅保留在服务端。</p>
  </main>
</body>
</html>
