<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#071310">
  <title>Vanna AI · 数据助手</title>
  <script type="module" src="https://img.vanna.ai/vanna-components.js"></script>
  <style>
    :root {
      --ink: #f1f7f5;
      --muted: #9fb4ae;
      --dim: #6f8580;
      --canvas: #06110e;
      --panel: rgba(13, 31, 26, .82);
      --line: rgba(152, 191, 179, .18);
      --teal: #45e0bc;
      --shadow: 0 28px 80px rgba(0, 0, 0, .34);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 0;
      color-scheme: dark;
    }

    body {
      min-width: 0;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 4%, rgba(37, 178, 143, .16), transparent 28rem),
        radial-gradient(circle at 92% 24%, rgba(56, 117, 101, .12), transparent 30rem),
        var(--canvas);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      opacity: .2;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }

    a { color: inherit; }

    .shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .nav {
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
      padding: 24px 0;
    }

    .brand {
      display: inline-flex;
      gap: 11px;
      align-items: center;
      min-width: 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 750;
      letter-spacing: .08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid rgba(69, 224, 188, .45);
      border-radius: 11px;
      color: var(--teal);
      background: rgba(69, 224, 188, .08);
      box-shadow: inset 0 0 20px rgba(69, 224, 188, .06);
    }

    .nav-link {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
      transition: color .2s ease, transform .2s ease;
    }

    .nav-link:hover {
      color: var(--teal);
      transform: translateX(-2px);
    }

    .chat-page {
      min-width: 0;
      padding: 24px 0 56px;
    }

    .page-intro {
      display: flex;
      gap: 32px;
      align-items: end;
      justify-content: space-between;
      min-width: 0;
      margin: 0 auto 26px;
      max-width: 1024px;
    }

    .intro-copy { min-width: 0; }

    .eyebrow {
      display: inline-flex;
      gap: 9px;
      align-items: center;
      margin-bottom: 12px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 7px;
      height: 7px;
      content: "";
      border-radius: 999px;
      background: var(--teal);
      box-shadow: 0 0 18px var(--teal);
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -.045em;
      text-wrap: balance;
    }

    .lede {
      max-width: 670px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .source-badge {
      display: inline-flex;
      gap: 9px;
      align-items: center;
      flex: 0 0 auto;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, .025);
      font-size: 12px;
      white-space: nowrap;
    }

    .source-badge::before {
      width: 6px;
      height: 6px;
      content: "";
      border-radius: 999px;
      background: var(--teal);
      box-shadow: 0 0 12px rgba(69, 224, 188, .7);
    }

    .source-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .source-controls[hidden] { display: none; }

    .source-controls label { color: var(--muted); font-size: 13px; }
    .source-controls select {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 0 10px;
      color: var(--ink);
      background: rgba(13, 31, 26, .88);
    }

    .chat-frame {
      min-width: 0;
      max-width: 1060px;
      margin: 0 auto;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background:
        linear-gradient(145deg, rgba(29, 67, 56, .46), rgba(8, 22, 18, .64)),
        var(--panel);
      box-shadow: var(--shadow);
    }

    vanna-chat {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .empty-state {
      display: grid;
      min-height: 420px;
      padding: clamp(28px, 7vw, 72px);
      place-items: center;
      text-align: center;
    }

    .empty-copy { max-width: 620px; }
    .empty-copy h2 { margin: 0; font-size: clamp(25px, 4vw, 36px); }
    .empty-copy p { margin: 14px 0 0; color: var(--muted); line-height: 1.7; }
    .empty-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 24px;
    }
    .empty-action {
      display: inline-flex;
      min-height: 42px;
      padding: 0 15px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--ink);
      background: rgba(255, 255, 255, .035);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    .empty-action.primary { border-color: var(--teal); color: #03251d; background: var(--teal); }

    .page-note {
      max-width: 1024px;
      margin: 18px auto 0;
      color: var(--dim);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 760px) {
      .shell { width: min(100% - 28px, 1180px); }

      .nav { padding-top: 18px; }

      .nav-link { font-size: 12px; }

      .chat-page { padding-top: 14px; }

      .page-intro {
        display: grid;
        gap: 16px;
        margin-bottom: 20px;
      }

      .source-badge { justify-self: start; }

      .chat-frame {
        padding: 9px;
        border-radius: 20px;
      }
    }

    @media (max-width: 380px) {
      .shell { width: calc(100% - 24px); }

      .nav { gap: 14px; }

      .brand {
        gap: 8px;
        font-size: 13px;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
      }

      h1 { font-size: 34px; }

      .chat-frame { padding: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .nav-link { transition: none; }
    }
  </style>
</head>
<body>
  <header class="shell nav">
    <a class="brand" href="/" aria-label="Vanna AI 首页">
      <span class="brand-mark" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none">
          <path d="M3 4.5 9.9 16 17 4.5h-3.4L9.9 11 6.2 4.5H3Z" fill="currentColor"/>
        </svg>
      </span>
      Vanna AI
    </a>
    <a class="nav-link" href="/">
      <span aria-hidden="true">←</span>
      返回能力首页
    </a>
  </header>

  <main class="shell chat-page">
    <section class="page-intro" aria-labelledby="page-title">
      <div class="intro-copy">
        <div class="eyebrow">Live data workspace</div>
        <h1 id="page-title">数据助手</h1>
        <p class="lede">
          用自然语言查询当前数据源，并查看可验证的只读 SQL 结果、数据表和图表。
          数据源与模型凭据都可在个人设置中管理。
        </p>
      </div>
      <div class="source-controls">
        <label for="data-source-select">当前对话数据源</label>
        <select id="data-source-select" aria-label="当前对话数据源"></select>
        <a class="source-badge" href="/settings#data-sources">个人设置</a>
      </div>
    </section>

    <section class="chat-frame" id="chat-container" aria-label="数据查询对话"></section>

    <p class="page-note">查询通过服务端只读数据工具执行；浏览器不会获得已保存的模型凭据或本地数据库路径。</p>
  </main>
  <script>
    (async () => {
      const select = document.querySelector('#data-source-select');
      const controls = document.querySelector('.source-controls');
      const container = document.querySelector('#chat-container');
      let selectedSource = new URLSearchParams(location.search).get('data_source_id');
      let conversationId = null;
      const nativeFetch = window.fetch.bind(window);
      const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
      const sourceSwitch = async id => {
        if (!conversationId || !id) return;
        const response = await nativeFetch(`/api/conversations/${encodeURIComponent(conversationId)}/data-source`, {
          method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({data_source_id: id})
        });
        if (!response.ok) throw new Error((await response.json()).detail || '数据源切换失败');
      };
      window.fetch = async (input, init = {}) => {
        const url = typeof input === 'string' ? input : input.url;
        if (url.includes('/chat/api/vanna/v2/') && init.body) {
          try {
            const payload = JSON.parse(init.body);
            conversationId = payload.conversation_id || conversationId;
            await sourceSwitch(selectedSource);
          } catch (error) { console.warn('data source switch failed', error); }
        }
        return nativeFetch(input, init);
      };

      function showSetup(readiness) {
        controls.hidden = true;
        const missingKey = !readiness.llm.configured;
        const missingSource = !readiness.data_sources.configured;
        const reasons = [
          missingKey ? 'DeepSeek API Key' : null,
          missingSource ? '可用数据源' : null
        ].filter(Boolean).join('和');
        const actions = readiness.actions.map((action, index) =>
          `<a class="empty-action ${index === 0 ? 'primary' : ''}" href="${escapeHtml(action.href)}">${escapeHtml(action.label)}</a>`
        ).join('');
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-copy">
              <h2>还差一步即可开始分析</h2>
              <p>当前缺少${escapeHtml(reasons || '必要配置')}。应用已经正常启动，完成下面的配置后刷新本页即可进入聊天。</p>
              <div class="empty-actions">${actions}</div>
            </div>
          </div>`;
      }

      function startChat(items) {
        const availableIds = items.map(item => item.id);
        if (!selectedSource || !availableIds.includes(selectedSource)) {
          selectedSource = items[0].id;
        }
        select.innerHTML = items.map(item =>
          `<option value="${escapeHtml(item.id)}">${escapeHtml(item.name)} · ${escapeHtml(item.kind)}</option>`
        ).join('');
        select.value = selectedSource;

        const chat = document.createElement('vanna-chat');
        chat.setAttribute('theme', 'dark');
        chat.setAttribute('title', '数据助手');
        chat.setAttribute('placeholder', '试试：列出当前数据库所有表，或根据数据生成汇总图表');
        chat.setAttribute('api-base', '/chat');
        chat.setAttribute('sse-endpoint', '/api/vanna/v2/chat_sse');
        chat.setAttribute('ws-endpoint', '/api/vanna/v2/chat_websocket');
        chat.setAttribute('poll-endpoint', '/api/vanna/v2/chat_poll');
        container.append(chat);
      }

      select.addEventListener('change', async event => {
        selectedSource = event.target.value;
        try { await sourceSwitch(selectedSource); } catch (error) { alert(error.message); }
      });

      try {
        const [readinessResponse, sourcesResponse] = await Promise.all([
          nativeFetch('/api/readiness'), nativeFetch('/api/data-sources')
        ]);
        if (!readinessResponse.ok || !sourcesResponse.ok) throw new Error('无法读取应用就绪状态');
        const [readiness, items] = await Promise.all([
          readinessResponse.json(), sourcesResponse.json()
        ]);
        if (!readiness.chat_ready) showSetup(readiness);
        else startChat(items);
      } catch (error) {
        controls.hidden = true;
        container.innerHTML = `<div class="empty-state"><div class="empty-copy"><h2>状态检查失败</h2><p>${escapeHtml(error.message)}</p><div class="empty-actions"><a class="empty-action primary" href="/settings">打开个人设置</a></div></div></div>`;
      }
    })();
  </script>
</body>
</html>
